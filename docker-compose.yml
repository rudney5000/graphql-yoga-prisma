version: "3.8"

services:
  db:
    image: postgres:12-alpine
    container_name: graphql-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dedy
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: graphql_learn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: